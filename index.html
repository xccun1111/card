<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김민준 | 바이브코딩 풀스택 개발자</title>
  <meta name="description" content="바이브코딩 풀스택 개발자 김민준의 인터랙티브 웹 명함입니다." />
  
  <!-- Pretendard 폰트 & Font Awesome 아이콘 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- 스타일시트 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 배경 데코레이션 요소 -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="card-container">
    <!-- 테마 토글 버튼 -->
    <button id="themeToggleBtn" class="theme-toggle" aria-label="테마 변경">
      <i class="fa-solid fa-moon"></i>
    </button>

    <!-- 3D 틸트 명함 카드 -->
    <div class="card" id="card">
      <div class="card-glow" id="cardGlow"></div>
      
      <!-- 상단 뱃지 & 상태 -->
      <div class="card-header">
        <span class="status-badge">
          <span class="status-dot"></span> Available for Vibe Coding
        </span>
        <span class="badge-tag">FULL-STACK</span>
      </div>

      <!-- 캐릭터 아바타 영역 -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-svg-container">
          <!-- 개발자 캐릭터 SVG -->
          <svg viewBox="0 0 200 200" class="developer-avatar" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- 그라디언트 정의 -->
              <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE7D0" />
                <stop offset="100%" stop-color="#FCD5B5" />
              </linearGradient>
              <linearGradient id="hairDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#374151" />
                <stop offset="100%" stop-color="#1F2937" />
              </linearGradient>
              <linearGradient id="silverHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="50%" stop-color="#E2E8F0" />
                <stop offset="100%" stop-color="#CBD5E1" />
              </linearGradient>
              <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60A5FA" />
                <stop offset="100%" stop-color="#3B82F6" />
              </linearGradient>
              <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38BDF8" />
                <stop offset="100%" stop-color="#818CF8" />
              </linearGradient>
              <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/>
              </filter>
            </defs>

            <!-- 배경 원 (밝고 산뜻한 민트/스카이빛) -->
            <circle cx="100" cy="100" r="92" fill="#F0F9FF" class="avatar-bg-circle"/>

            <!-- 몸통 / 밝은 블루 후드티 -->
            <g class="body-group">
              <path d="M45,190 C45,148 68,138 100,138 C132,138 155,148 155,190 Z" fill="url(#hoodieGrad)" filter="url(#avatarShadow)" />
              <!-- 후드티 깃/끈 -->
              <path d="M86,138 Q100,165 114,138" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
              <path d="M92,154 L92,172" stroke="#EFF6FF" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M108,154 L108,170" stroke="#EFF6FF" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- 목 -->
            <rect x="88" y="116" width="24" height="26" rx="6" fill="#F6CBA3"/>

            <!-- 헤어 (뒷머리 베이스) -->
            <path d="M56,92 C54,58 72,38 100,38 C128,38 146,58 144,92 Z" fill="url(#hairDarkGrad)"/>
            <!-- 뒷머리 옆쪽 흰머리 믹스 -->
            <path d="M57,80 C56,66 65,52 75,46" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
            <path d="M143,80 C144,66 135,52 125,46" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

            <!-- 귀 -->
            <ellipse cx="62" cy="98" rx="7" ry="10" fill="url(#skinGrad)"/>
            <ellipse cx="138" cy="98" rx="7" ry="10" fill="url(#skinGrad)"/>

            <!-- 얼굴 -->
            <path d="M66,86 C66,66 78,54 100,54 C122,54 134,66 134,86 C134,115 120,126 100,126 C80,126 66,115 66,86 Z" fill="url(#skinGrad)" filter="url(#avatarShadow)"/>

            <!-- 앞머리 베이스 (다크 헤어) -->
            <path d="M65,72 C70,54 85,48 100,52 C114,48 130,54 135,74 C126,67 116,65 105,67 C95,65 80,64 65,72 Z" fill="url(#hairDarkGrad)"/>
            <path d="M72,70 C79,77 88,77 96,72" fill="url(#hairDarkGrad)"/>

            <!-- 앞머리 & 옆머리 흰머리 (스타일리시한 실버/화이트 스트릭) -->
            <g class="white-hair-streaks">
              <!-- 이마 앞쪽 자연스러운 흰머리 가닥들 -->
              <path d="M69,67 C75,56 86,52 94,54" stroke="url(#silverHairGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path d="M75,69 C82,60 92,57 98,60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <path d="M102,57 C112,54 124,58 130,68" stroke="url(#silverHairGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M106,62 C116,61 123,66 128,72" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
              
              <!-- 옆머리/구레나룻 부분 포인트 흰머리 -->
              <path d="M64,74 C63,82 64,88 66,93" stroke="#F1F5F9" stroke-width="2.8" stroke-linecap="round" fill="none"/>
              <path d="M66,77 C66,83 67,89 69,92" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none"/>
              <path d="M136,74 C137,82 136,88 134,93" stroke="#F1F5F9" stroke-width="2.8" stroke-linecap="round" fill="none"/>
              
              <!-- 윗머리 은빛 브릿지 가닥 -->
              <path d="M82,45 C90,42 108,42 116,46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
              <path d="M88,41 C96,39 104,39 110,42" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
            </g>

            <!-- 눈썹 (지적이고 부드러운 호감형 곡선) -->
            <path d="M76,81 Q85,77 93,80" stroke="#374151" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <path d="M107,80 Q115,77 124,81" stroke="#374151" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <!-- 눈썹 흰머리 포인트 한 가닥 -->
            <path d="M78,80 Q84,77 90,79" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>

            <!-- 눈 (안경 없이 밝고 맑고 또렷한 눈매) -->
            <g class="eyes">
              <!-- 쌍꺼풀/눈꺼풀 라인 -->
              <path d="M77,85 Q85,83 92,86" stroke="#D19970" stroke-width="1.4" stroke-linecap="round" fill="none"/>
              <path d="M108,86 Q115,83 123,85" stroke="#D19970" stroke-width="1.4" stroke-linecap="round" fill="none"/>

              <!-- 왼쪽 눈 (초롱초롱한 동공 & 빛망울) -->
              <ellipse cx="85" cy="91" rx="4.5" ry="5.5" fill="#1E293B"/>
              <ellipse cx="85" cy="92" rx="3.5" ry="4" fill="#3B82F6" opacity="0.25"/>
              <circle cx="86.8" cy="88.8" r="1.8" fill="#FFFFFF"/>
              <circle cx="83.5" cy="93.2" r="0.9" fill="#FFFFFF" opacity="0.8"/>

              <!-- 오른쪽 눈 (초롱초롱한 동공 & 빛망울) -->
              <ellipse cx="115" cy="91" rx="4.5" ry="5.5" fill="#1E293B"/>
              <ellipse cx="115" cy="92" rx="3.5" ry="4" fill="#3B82F6" opacity="0.25"/>
              <circle cx="116.8" cy="88.8" r="1.8" fill="#FFFFFF"/>
              <circle cx="113.5" cy="93.2" r="0.9" fill="#FFFFFF" opacity="0.8"/>
            </g>

            <!-- 귀여운 볼터치 (화사하고 건강한 생기) -->
            <ellipse cx="73" cy="99" rx="6" ry="3" fill="#FB7185" opacity="0.4"/>
            <ellipse cx="127" cy="99" rx="6" ry="3" fill="#FB7185" opacity="0.4"/>

            <!-- 다정하고 시원하게 미소 짓는 입 -->
            <path d="M92,104 Q100,113 108,104" stroke="#BE123C" stroke-width="2.6" stroke-linecap="round" fill="none"/>

            <!-- 트렌디한 헤드셋 (바이브 코딩의 상징) -->
            <g class="headphones">
              <!-- 헤드밴드 -->
              <path d="M57,90 C55,47 70,30 100,30 C130,30 145,47 143,90" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M67,50 C80,42 120,42 133,50" fill="none" stroke="url(#headphoneGrad)" stroke-width="3" stroke-linecap="round"/>
              
              <!-- 헤드폰 이어컵 (화사한 파스텔 톤) -->
              <rect x="52" y="80" width="12" height="28" rx="6" fill="url(#headphoneGrad)" filter="url(#avatarShadow)"/>
              <rect x="55" y="85" width="6" height="18" rx="3" fill="#FFFFFF" opacity="0.7"/>
              
              <rect x="136" y="80" width="12" height="28" rx="6" fill="url(#headphoneGrad)" filter="url(#avatarShadow)"/>
              <rect x="139" y="85" width="6" height="18" rx="3" fill="#FFFFFF" opacity="0.7"/>

              <!-- 마이크 -->
              <path d="M60,102 Q64,122 84,118" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="85" cy="118" r="3.5" fill="#38BDF8"/>
            </g>

            <!-- 코딩 이모지 데코레이션 (둥둥 뜨는 효과) -->
            <g class="floating-icons">
              <!-- 코드 브래킷 -->
              <text x="30" y="55" font-family="monospace" font-size="16" font-weight="bold" fill="#3B82F6" opacity="0.9">&lt;/&gt;</text>
              <!-- 번개/아이디어 -->
              <text x="145" y="58" font-size="16" fill="#F59E0B">✨</text>
              <!-- 음표/바이브 -->
              <text x="148" y="125" font-size="14" fill="#EC4899">🎵</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- 명함 프로필 정보 -->
      <div class="profile-info">
        <h1 class="name">김민준 <span class="en-name">Minjun Kim</span></h1>
        <p class="role">
          <i class="fa-solid fa-laptop-code"></i> 바이브코딩 풀스택 개발자
        </p>
        <p class="bio">
          "감각적인 직관과 탄탄한 풀스택 기술로, <br />
          생각하는 아이디어를 리듬감 있게 현실로 구현합니다."
        </p>
      </div>

      <!-- 기술 스택 태그 -->
      <div class="tech-tags">
        <span class="tag">Next.js</span>
        <span class="tag">React</span>
        <span class="tag">TypeScript</span>
        <span class="tag">Node.js</span>
        <span class="tag">AI Driven</span>
        <span class="tag">FastAPI</span>
      </div>

      <!-- 연락처 리스트 -->
      <div class="contact-list">
        <!-- 이메일 -->
        <div class="contact-item" id="emailItem">
          <div class="contact-icon email">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div class="contact-text">
            <span class="label">EMAIL</span>
            <a href="mailto:kimmj@gmail.com" class="value" id="emailVal">kimmj@gmail.com</a>
          </div>
          <button class="copy-btn" data-copy="kimmj@gmail.com" title="이메일 복사" aria-label="이메일 주소 복사">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <!-- 전화번호 -->
        <div class="contact-item" id="phoneItem">
          <div class="contact-icon phone">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="contact-text">
            <span class="label">PHONE</span>
            <a href="tel:01034126530" class="value" id="phoneVal">010-3412-6530</a>
          </div>
          <button class="copy-btn" data-copy="010-3412-6530" title="전화번호 복사" aria-label="전화번호 복사">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- 액션 버튼들 -->
      <div class="card-actions">
        <!-- 전화 걸기 / 이메일 보내기 액션 -->
        <a href="tel:01034126530" class="action-btn primary-btn">
          <i class="fa-solid fa-phone-volume"></i> 전화걸기
        </a>
        <a href="mailto:kimmj@gmail.com" class="action-btn secondary-btn">
          <i class="fa-solid fa-paper-plane"></i> 메일보내기
        </a>
      </div>

      <!-- 하단 유틸리티 버튼 (연락처 저장 / 공유) -->
      <div class="footer-actions">
        <button id="saveContactBtn" class="util-btn" title="스마트폰 연락처로 저장 (.vcf)">
          <i class="fa-solid fa-address-card"></i> 연락처 저장
        </button>
        <button id="shareCardBtn" class="util-btn" title="명함 링크 복사">
          <i class="fa-solid fa-share-nodes"></i> 명함 공유
        </button>
      </div>

      <!-- 카드 하단 로고/워터마크 -->
      <div class="card-footer">
        <span>© 2026 MINJUN KIM • VIBE CODING STUDIO</span>
      </div>
    </div>
  </main>

  <!-- 토스트 알림창 -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
